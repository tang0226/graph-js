<!DOCTYPE html>
<html>
<head>

</head>
<body>
<p>Drag to pan, scroll to zoom. Zoom: <span id="zoom"></span></p>
<canvas id="canvas" style="border: 1px solid black; touch-action: none"></canvas>
<script type="module">
import { GraphJS } from "../src/graphjs.js";

const width = 1000;
const height = 1000;
const canvas = document.querySelector("#canvas");

// Size the canvas with CSS only. Attaching measures it and sizes the drawing
// buffer to match the device pixel ratio, so setting canvas.width/height by
// hand would just be overwritten.
canvas.style.width = width + "px";
canvas.style.height = height + "px";

const gjs = new GraphJS({ canvas });

gjs.addNode({id: "a"});
gjs.addNode({id: "b"});
gjs.addNode({id: "c"});
gjs.addNode({id: "d"});
gjs.addNode({id: "e"});

gjs.addEdge("a", "b");
gjs.addEdge("a", "c");
gjs.addEdge("b", "d");
gjs.addEdge("a", "e");


// Test on some unsplash images
gjs.renderer.setNodeConfig("a", {
  image: "https://plus.unsplash.com/premium_photo-1790975903282-5fd06b30f35f?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
});

gjs.renderer.setNodeConfig("b", {
  image: "https://plus.unsplash.com/premium_photo-1762564681819-6f6f626ffabc?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
});

gjs.renderer.setNodeConfig("c", {
  image: "https://plus.unsplash.com/premium_photo-1790117179082-8bd550a356e2?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
});

gjs.renderer.view.zoom = 2;

gjs.start();


// Drag to pan, scroll to zoom. The render loop is running, so view changes
// show up on the next frame without calling render().
const zoomOut = document.querySelector("#zoom");
const showZoom = () => { zoomOut.textContent = gjs.renderer.view.zoom.toFixed(2); };
showZoom();

function pointerToCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

let pan = null;

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  const v = gjs.renderer.view;
  pan = { sx: e.clientX, sy: e.clientY, vx: v.x, vy: v.y };
});

canvas.addEventListener("pointermove", e => {
  if (!pan) return;
  const v = gjs.renderer.view;
  v.x = pan.vx - (e.clientX - pan.sx) / v.zoom;
  v.y = pan.vy - (e.clientY - pan.sy) / v.zoom;
});

canvas.addEventListener("pointerup", () => { pan = null; });
canvas.addEventListener("pointercancel", () => { pan = null; });

// Wide range on purpose: small enough to hit the dot fallback, large enough
// to need the biggest sprites.
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const [cx, cy] = pointerToCanvas(e);
  const [bx, by] = gjs.canvasToSim(cx, cy);   // keep this point under the cursor
  const v = gjs.renderer.view;
  v.zoom = Math.min(50, Math.max(0.02, v.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  const [ax, ay] = gjs.canvasToSim(cx, cy);
  v.x += bx - ax;
  v.y += by - ay;
  showZoom();
}, { passive: false });

</script>
</body>
</html>
